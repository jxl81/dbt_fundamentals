sources:  
  - name: jaffle_shop
    database:  raw
    schema: jaffle_shop
    description: "A sample data source for the Jaffle Shop project."
    tables:
      - name: customers
        description: "Contains customer information including names and contact details."
      - name: orders
        description: "Contains order details including order ID, customer ID, and order date."
        #config:
          freshness:
            warn_after:
              count: 12
              period: hour
            error_after: 
              count: 1
              period: day
          loaded_at_field: _etl_loaded_at